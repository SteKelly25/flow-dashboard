<style>
/* Layout: sticky header, searchable full-width table, Flow brand palette */
:root {
  --purple: #8601FF;
  --darkblue: #1C0D75;
  --blue: #4A34FF;
  --pink: #FF42D9;
  --bg: #f7f6fb;
  --surface: #ffffff;
  --border: #e4e0f0;
  --ink: #1C0D75;
  --ink2: #6b6499;
  --live: #0d9e57;
  --live-bg: #e8f9f1;
  --pending-bg: #f0eeff;
  --pending: #8601FF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100c22;
    --surface: #1a1435;
    --border: #2e2850;
    --ink: #e8e4ff;
    --ink2: #9e97c8;
    --live-bg: #0a2e1c;
    --pending-bg: #1e1540;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100c22;
  --surface: #1a1435;
  --border: #2e2850;
  --ink: #e8e4ff;
  --ink2: #9e97c8;
  --live-bg: #0a2e1c;
  --pending-bg: #1e1540;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Work Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--darkblue) 0%, var(--blue) 100%);
  margin-left: max(-16px, calc(-1 * env(safe-area-inset-left, 0px)));
  margin-right: max(-16px, calc(-1 * env(safe-area-inset-right, 0px)));
  padding: 28px max(24px, env(safe-area-inset-left, 16px));
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}
.header-logo {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
}
.header-text { min-width: 0; }
.header-title {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 2px;
}
.header-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  margin: 0;
}

/* Controls */
.controls {
  max-width: 960px;
  margin: 0 auto 16px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink2);
  pointer-events: none;
}
.search {
  width: 100%;
  padding: 9px 12px 9px 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.search:focus { border-color: var(--purple); }
.filter-wrap { display: flex; gap: 8px; }
.filter-btn {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink2);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.filter-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }
.count {
  font-size: 13px;
  color: var(--ink2);
  white-space: nowrap;
  align-self: center;
}

/* Table */
.table-wrap {
  max-width: 960px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.table-scroll { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  min-width: 480px;
}
thead th {
  text-align: left;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink2);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--bg); }
td {
  padding: 12px 16px;
  vertical-align: middle;
}
.td-name { font-weight: 500; color: var(--ink); }
.td-ye { color: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.status-live { background: var(--live-bg); color: var(--live); }
.status-pending { background: var(--pending-bg); color: var(--pending); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.link-cell a {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
}
.link-cell a:hover { text-decoration: underline; }
.link-cell.empty { color: var(--ink2); font-size: 13px; }
.hidden-row { display: none; }
</style>

clients.sort((a, b) => {
  if (a.status !== b.status) return a.status === 'live' ? -1 : 1;
  return a.name.localeCompare(b.name);
});

const tbody = document.getElementById('tbody');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
const filterBtns = document.querySelectorAll('.filter-btn');
let activeFilter = 'all';

function render() {
  const q = searchEl.value.toLowerCase().trim();
  let visible = 0;
  const rows = tbody.querySelectorAll('tr');
  rows.forEach(row => {
    const name = row.dataset.name;
    const status = row.dataset.status;
    const matchSearch = !q || name.includes(q);
    const matchFilter = activeFilter === 'all' || status === activeFilter;
    const show = matchSearch && matchFilter;
    row.classList.toggle('hidden-row', !show);
    if (show) visible++;
  });
  const total = clients.length;
  const live = clients.filter(c => c.status === 'live').length;
  countEl.textContent = q || activeFilter !== 'all'
    ? `${visible} of ${total} clients`
    : `${total} clients · ${live} live`;
}

// Build rows
clients.forEach(c => {
  const tr = document.createElement('tr');
  tr.dataset.name = c.name.toLowerCase();
  tr.dataset.status = c.status;
  const pillClass = c.status === 'live' ? 'status-live' : 'status-pending';
  const pillLabel = c.status === 'live' ? 'Live' : 'Pending';
  const linkCell = c.url
    ? `<td class="link-cell"><a href="${c.url}" target="_blank" rel="noopener">Open dashboard ↗</a></td>`
    : `<td class="link-cell empty">Not yet set up</td>`;

    <td class="td-name">${c.name}</td>
    <td class="td-ye">${c.ye}</td>
    <td><span class="status-pill ${pillClass}"><span class="dot"></span>${pillLabel}</span></td>
    ${linkCell}
  `;
  tbody.appendChild(tr);
});

    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});
